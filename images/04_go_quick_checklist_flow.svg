<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-teal2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-purple2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="960" height="390" rx="14" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Example 2: Quick Checklist — App-Only Tools, Persistence &amp; Context Pills</text>

  <!-- Agent -->
  <rect x="28" y="76" width="176" height="92" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="116" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">LLM Agent</text>
  <text x="116" y="128" text-anchor="middle" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#6d28d9">create_checklist()</text>
  <text x="116" y="148" text-anchor="middle" font-size="11" fill="#64748b">(only sees model tools)</text>

  <!-- Go Server -->
  <rect x="280" y="64" width="290" height="176" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="425" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#155e75">Go MCP Server</text>
  <text x="425" y="108" text-anchor="middle" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#0e7490">scripts/checklist-server</text>

  <rect x="298" y="120" width="254" height="44" rx="7" fill="#ffffff" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="425" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Model Tool: create_checklist</text>
  <text x="425" y="155" text-anchor="middle" font-size="10.5" fill="#475569">resourceUri: ui://quick-checklist/app.html</text>

  <rect x="298" y="174" width="254" height="52" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="425" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">App-Only Tools (visibility: ["app"])</text>
  <text x="425" y="213" text-anchor="middle" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#15803d">app_toggle_item · app_add_item</text>

  <!-- Disk persistence -->
  <rect x="280" y="286" width="290" height="72" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="425" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Eager Disk Persistence</text>
  <text x="425" y="334" text-anchor="middle" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#b45309">${PLUGIN_DATA}/checklists.json</text>
  <text x="425" y="350" text-anchor="middle" font-size="10.5" fill="#92400e">Saved on every edit (no teardown event)</text>

  <!-- Inline Card -->
  <rect x="656" y="64" width="276" height="176" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="794" y="89" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">Inline Quick Checklist Card</text>

  <rect x="674" y="102" width="240" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="688" y="124" font-size="12" fill="#0f172a">☑  Run go test ./...</text>
  <text x="688" y="144" font-size="12" fill="#0f172a">☐  Check error handling</text>
  <text x="688" y="164" font-size="12" fill="#0f172a">☐  Verify plugin manifest</text>

  <rect x="674" y="196" width="240" height="30" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="794" y="215" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5b21b6">Attach Remaining Items to Prompt</text>

  <!-- Next User Message Pill -->
  <rect x="656" y="286" width="276" height="72" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="794" y="313" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">User's Next Chat Message</text>
  <rect x="684" y="324" width="220" height="24" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="794" y="340" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">Context Pill: PR Review (1/3 done)</text>

  <!-- Arrows -->
  <line x1="204" y1="122" x2="274" y2="122" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue2)"/>
  <line x1="570" y1="138" x2="650" y2="138" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue2)"/>
  <text x="613" y="130" text-anchor="middle" font-size="10.5" fill="#1e40af">renders UI</text>

  <line x1="656" y1="196" x2="576" y2="196" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-teal2)"/>
  <text x="613" y="188" text-anchor="middle" font-size="10.5" font-weight="600" fill="#115e59">toggle / add</text>

  <line x1="425" y1="240" x2="425" y2="280" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-teal2)"/>
  <text x="488" y="266" text-anchor="middle" font-size="10.5" fill="#92400e">atomic save</text>

  <line x1="794" y1="240" x2="794" y2="280" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple2)"/>
  <text x="866" y="266" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5b21b6">updateModelContext()</text>
</svg>
