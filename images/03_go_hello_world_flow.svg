<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="960" height="320" rx="14" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Example 1: Hello World in Go (Single Binary with //go:embed)</text>

  <!-- Node 1: Agent -->
  <rect x="34" y="106" width="180" height="96" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="124" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">LLM Agent</text>
  <text x="124" y="160" text-anchor="middle" font-size="12" fill="#4c1d95">Calls tool:</text>
  <text x="124" y="180" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#6d28d9">say_hello(name="Ada")</text>

  <!-- Node 2: Go Server Binary -->
  <rect x="288" y="74" width="322" height="162" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="449" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#155e75">Go MCP Server Binary</text>
  <text x="449" y="120" text-anchor="middle" font-size="11.5" font-family="ui-monospace, Menlo, monospace" fill="#0e7490">scripts/hello-server (stdio)</text>

  <rect x="308" y="134" width="134" height="84" rx="8" fill="#ffffff" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="375" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">main.go</text>
  <text x="375" y="177" text-anchor="middle" font-size="11" fill="#475569">say_hello tool</text>
  <text x="375" y="194" text-anchor="middle" font-size="11" fill="#475569">atomic pingCount</text>
  <text x="375" y="210" text-anchor="middle" font-size="10.5" fill="#64748b">go-sdk v1.8.0</text>

  <rect x="456" y="134" width="134" height="84" rx="8" fill="#ffffff" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="523" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">//go:embed</text>
  <text x="523" y="177" text-anchor="middle" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#0e7490">dist/app.html</text>
  <text x="523" y="194" text-anchor="middle" font-size="11" fill="#475569">esbuild single-file</text>
  <text x="523" y="210" text-anchor="middle" font-size="10.5" fill="#64748b">651 KiB inline UI</text>

  <!-- Node 3: Inline Greeting Card -->
  <rect x="688" y="88" width="238" height="134" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="807" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Inline Card in Antigravity</text>
  <rect x="706" y="128" width="202" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="720" y="152" font-size="14" font-weight="700" fill="#0f172a">Hello, Ada!</text>
  <text x="720" y="170" font-size="10.5" fill="#64748b">Server time · call #1</text>
  <rect x="720" y="179" width="128" height="20" rx="5" fill="#ddf4ff" stroke="#54aeff" stroke-width="1"/>
  <text x="784" y="193" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0969da">Ping Server Again</text>

  <!-- Forward arrows -->
  <line x1="214" y1="154" x2="282" y2="154" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="250" y="146" text-anchor="middle" font-size="11" fill="#334155">tools/call</text>

  <line x1="610" y1="138" x2="682" y2="138" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="647" y="129" text-anchor="middle" font-size="10.5" fill="#1e40af">ui:// HTML</text>

  <line x1="610" y1="176" x2="682" y2="176" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="647" y="168" text-anchor="middle" font-size="10.5" fill="#1e40af">JSON result</text>

  <!-- Callback arrow from button back to Go server -->
  <path d="M 807 222 L 807 276 L 449 276 L 449 242" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arr-g)"/>
  <rect x="528" y="262" width="240" height="26" rx="13" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="648" y="279" text-anchor="middle" font-size="11.5" font-weight="600" fill="#166534">app.callServerTool("say_hello")</text>
</svg>
