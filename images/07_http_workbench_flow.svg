<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-b3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-t3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-p3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-o3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="960" height="390" rx="14" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Local HTTP Request Workbench: Side Panel + Full-Page Architecture</text>

  <!-- Left: Entrypoints -->
  <rect x="28" y="70" width="184" height="162" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="120" y="96" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5b21b6">How Users Open It</text>

  <rect x="42" y="110" width="156" height="46" rx="7" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="120" y="129" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Side Panel (aux_pane)</text>
  <text x="120" y="146" text-anchor="middle" font-size="10.5" fill="#475569">Agent call or + menu ({})</text>

  <rect x="42" y="168" width="156" height="46" rx="7" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="120" y="187" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Full Page (global)</text>
  <text x="120" y="204" text-anchor="middle" font-size="10.5" fill="#475569">Left sidebar Plugins ({})</text>

  <!-- Center: Go MCP Server -->
  <rect x="284" y="64" width="290" height="180" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="429" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#155e75">Go MCP Server Binary</text>
  <text x="429" y="108" text-anchor="middle" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#0e7490">single binary with //go:embed</text>

  <rect x="302" y="122" width="254" height="46" rx="7" fill="#ffffff" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="429" y="141" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">open_workbench(url?, method?)</text>
  <text x="429" y="158" text-anchor="middle" font-size="10.5" fill="#475569">All args optional · aux_pane + global</text>

  <rect x="302" y="178" width="254" height="52" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="429" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">App-Only Tools (visibility: ["app"])</text>
  <text x="429" y="216" text-anchor="middle" font-size="11" fill="#15803d">Send HTTP (net/http) · Save presets</text>

  <!-- Bottom Center: Local API + Disk -->
  <rect x="284" y="292" width="138" height="68" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/>
  <text x="353" y="319" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a3412">Target API</text>
  <text x="353" y="338" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#b45309">localhost / HTTP</text>
  <text x="353" y="352" text-anchor="middle" font-size="10" fill="#9a3412">Runs in Go (safe CSP)</text>

  <rect x="436" y="292" width="138" height="68" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="505" y="319" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Saved Presets</text>
  <text x="505" y="338" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#b45309">PLUGIN_DATA</text>
  <text x="505" y="352" text-anchor="middle" font-size="10" fill="#92400e">Persists across restarts</text>

  <!-- Right: Workbench UI -->
  <rect x="652" y="64" width="280" height="180" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="792" y="89" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">HTTP Workbench UI (Iframe)</text>

  <rect x="670" y="102" width="244" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="684" y="123" font-size="10.5" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="#0f172a">GET http://localhost:8080/health</text>
  <rect x="684" y="133" width="62" height="19" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="715" y="146" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">500 ERR</text>
  <text x="756" y="146" font-size="10.5" fill="#64748b">42 ms · JSON response</text>
  <text x="684" y="172" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#475569">{"error": "db connection refused"}</text>

  <rect x="670" y="196" width="244" height="32" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="792" y="216" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5b21b6">Ask Agent to Debug (hidden in global)</text>

  <!-- Bottom Right: Active Chat -->
  <rect x="652" y="292" width="280" height="68" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="792" y="319" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Active Chat Conversation</text>
  <text x="792" y="340" text-anchor="middle" font-size="11" fill="#4c1d95">Receives prompt when in aux_pane</text>

  <!-- Arrows -->
  <line x1="212" y1="145" x2="278" y2="145" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b3)"/>
  <text x="246" y="137" text-anchor="middle" font-size="10.5" fill="#1e40af">tools/call</text>

  <line x1="574" y1="138" x2="646" y2="138" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b3)"/>
  <text x="611" y="130" text-anchor="middle" font-size="10.5" fill="#1e40af">renders UI</text>

  <line x1="652" y1="198" x2="580" y2="198" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-t3)"/>
  <text x="615" y="190" text-anchor="middle" font-size="10.5" font-weight="600" fill="#115e59">Send / Save</text>

  <line x1="353" y1="244" x2="353" y2="286" stroke="#d97706" stroke-width="2" marker-end="url(#arr-o3)"/>
  <line x1="505" y1="244" x2="505" y2="286" stroke="#d97706" stroke-width="2" marker-end="url(#arr-o3)"/>

  <line x1="792" y1="244" x2="792" y2="286" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-p3)"/>
  <text x="858" y="270" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5b21b6">app.sendMessage()</text>
</svg>